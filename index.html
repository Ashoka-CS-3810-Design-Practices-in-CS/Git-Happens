<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Scheduler</title>
</head>
<body>
  <div id="app">Smart Scheduler is loading…</div>

  <!--
    Plain scripts, loaded in layer order (dependencies first), so the app
    opens by double-clicking this file. No server, no import/export.
    Every file attaches its functions to window.SS.
  -->

  <!-- Store / Domain -->
  <script src="store/interval.js"></script>
  <script src="store/records.js"></script>
  <script src="store/eventStore.js"></script>
  <script src="store/persistence.js"></script>

  <!-- Conflict -->
  <!-- <script src="conflict/detectConflicts.js"></script> -->

  <!-- Scheduling -->
  <!-- <script src="scheduling/mergeIntervals.js"></script> -->
  <!-- <script src="scheduling/complement.js"></script> -->
  <!-- <script src="scheduling/findBestSlots.js"></script> -->

  <!-- Application -->
  <!-- <script src="application/validation.js"></script> -->
  <!-- <script src="application/app.js"></script> -->

  <!-- Presentation (Yashita's week.html code moves here) -->
  <!-- <script src="presentation/weekView.js"></script> -->

  <script>
    // Temporary start-up check. The application layer will take this over.
    const store = new SS.EventStore();
    const persistence = new SS.Persistence(store, {
      onSaveError: (err) => console.warn(err.message),
    });
    const result = persistence.load();
    window.addEventListener("beforeunload", () => persistence.flush());
    document.getElementById("app").textContent =
      "Store loaded: " + result.status + " (" + store.size + " events)" +
      (result.warning ? " - " + result.warning : "");
  </script>
</body>
</html>
